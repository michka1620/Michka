# Configuracion de STAGING para el Worker frontal -- archivo separado a proposito de
# wrangler.toml (produccion), para que un valor mal copiado sea visible de inmediato en
# cualquier diff. Nunca se despliega con este archivo a "bold-mouse-3bc3" (produccion).
name = "bold-mouse-3bc3-staging"
compatibility_date = "2024-01-01"
account_id = "62fb45b77a7da33a4614d06fab267b4b"
main = "_worker.js"

[assets]
directory = "."

[[services]]
binding = "SUPREMEKV"
service = "supremekv1-staging"

# ACCESS_TEAM_DOMAIN y ACCESS_AUD no son secretos (Cloudflare los expone en el
# propio dashboard de la Access Application), asi que se declaran aqui para que
# sobrevivan cualquier despliegue futuro. ACCESS_ROLES_JSON SI contiene correos
# reales y se agrega unicamente como Secret desde el dashboard -- nunca en este
# archivo ni en el repositorio.
[vars]
ACCESS_TEAM_DOMAIN = "michka1620.cloudflareaccess.com"
ACCESS_AUD = "7a6ee493f83e89cd915a87a3a363ae62744fba8565111670e6bf532461e5afcf"
