<head>

<title>Supreme AutoPro — Pilot</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f2f5;min-height:100vh}
.app{max-width:520px;margin:0 auto;background:#fff;min-height:100vh}
.topbar{background:#1a1a2e;color:white;padding:14px 16px 0}
.topbar h1{font-size:17px;font-weight:900;letter-spacing:1px}
.nav{background:#1a1a2e;display:flex}
.nav button{flex:1;padding:12px 6px;color:#888;font-size:11px;font-weight:700;text-align:center;cursor:pointer;border:none;background:none;text-transform:uppercase;border-bottom:3px solid transparent}
.nav button.active{color:#e63946;border-bottom-color:#e63946}
.page{display:none;padding:14px}
.page.active{display:block}
.card{background:#f8f9fa;border-radius:12px;padding:16px;margin-bottom:10px;text-align:center}
.card.dark{background:#1a1a2e;color:white}
.card .amt{font-size:26px;font-weight:900}
.card .lbl{font-size:11px;color:#999;text-transform:uppercase;margin-top:4px}
.card.dark .lbl{color:#aaa}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.btn-red{width:100%;padding:13px;background:#e63946;color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px}
.inv-item{padding:12px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;gap:10px;align-items:center}
.inv-item:hover{background:#fafafa}
.dot{width:8px;height:8px;border-radius:50%;background:#ffc107;flex-shrink:0}
.dot.paid{background:#28a745}
.info{flex:1;min-width:0}
.co{font-size:13px;font-weight:700;color:#1a1a2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:#999;margin-top:2px}
.badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;margin-top:3px;display:inline-block}
.bp{background:#fff3cd;color:#856404}
.bpd{background:#d4edda;color:#155724}
.amt-col{font-size:14px;font-weight:700;text-align:right;white-space:nowrap}
.zero{color:#ccc}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;color:#222;background:#fafafa;outline:none;margin-bottom:10px}
input:focus,select:focus,textarea:focus{border-color:#e63946;background:#fff}
textarea{resize:vertical;min-height:56px}
label{display:block;font-size:11px;color:#777;margin-bottom:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seclbl{font-size:10px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:1px;margin:14px 0 8px}
.tire-box{background:#f8f9fa;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid #eee;position:relative}
.tire-box .xbtn{position:absolute;top:8px;right:10px;background:none;border:none;color:#ccc;font-size:20px;cursor:pointer;padding:0;width:auto;margin:0}
.add-tire{width:100%;padding:10px;border:2px dashed #ddd;border-radius:8px;background:none;color:#bbb;font-size:13px;cursor:pointer;margin-bottom:12px}
.total-box{background:#1a1a2e;border-radius:12px;padding:16px;margin:14px 0}
.total-box label{color:#aaa}
.total-box input{background:transparent;border:none;border-bottom:2px solid #444;color:white;font-size:28px;font-weight:900;margin:4px 0 0}
.search{padding:10px 14px;border-bottom:1px solid #f0f0f0}
.search input{margin:0}
.syncbar{padding:8px 14px;background:#f8f9fa;border-bottom:1px solid #eee;display:flex;gap:8px}
.syncbar button{flex:1;padding:7px;border-radius:7px;border:1px solid #ddd;background:white;font-size:11px;font-weight:700;cursor:pointer;color:#555;width:auto;margin:0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:white;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:all .3s;z-index:999;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#c1121f}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end}
.overlay.open{display:flex}
.sheet{background:white;width:100%;max-width:520px;margin:0 auto;border-radius:16px 16px 0 0;max-height:90vh;overflow-y:auto;padding:0 0 20px}
.handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:12px auto}
.sh{padding:0 16px 12px;border-bottom:1px solid #f0f0f0}
.sc{font-size:16px;font-weight:900;color:#1a1a2e}
.ss{font-size:12px;color:#999;margin-top:2px}
.sb{padding:14px 16px}
.sr{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f8f8f8}
.sk{font-size:12px;color:#999}
.sv{font-size:12px;font-weight:600;color:#222;text-align:right;max-width:60%}
.stot{background:#1a1a2e;color:white;border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin:14px 16px 0}
.sbtns{display:flex;gap:8px;padding:12px 16px 0}
.sbtns button{flex:1;padding:11px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;width:auto;margin:0}
.pb{background:#28a745;color:white}
.pe{background:#ffc107;color:#333}
.pc{background:#f0f0f0;color:#333}
.pbadge{display:inline-block;background:#e63946;color:white;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<div class="app">
<div class="topbar"><h1>SUPREME AUTOPRO LLC</h1></div>
<div class="nav">
  <button id="nb-summary" class="active" onclick="goTo('summary')">Resumen</button>
  <button id="nb-history" onclick="goTo('history')">Historial</button>
  <button id="nb-new" onclick="goTo('new')">+ Nueva</button>
</div>

<div id="pg-summary" class="page active"></div>

<div id="pg-history" class="page" style="padding:0">
  <div class="syncbar">
    <button onclick="toast2('Recargado')">&#128260; Recargar</button>
    <button onclick="toast2('Guardado local')">&#128190; Local</button>
  </div>
  <div class="search"><input id="q" placeholder="Buscar..." oninput="renderH()"></div>
  <div id="hlist"></div>
</div>

<div id="pg-new" class="page">
  <div class="seclbl">Datos del Dispatch</div>
  <div class="row2">
    <div><label>PO # Dispatch</label><input id="f-po" placeholder="766908289"></div>
    <div><label>WO # Dispatch</label><input id="f-wo" placeholder="4920132XXX"></div>
  </div>
  <label>Cliente / Empresa</label><input id="f-client" placeholder="SMYRNA READY MIX...">
  <div class="row2">
    <div><label>Unidad</label><input id="f-unit" placeholder="TRACTOR #12345"></div>
    <div><label>Driver</label><input id="f-driver" placeholder="Nombre"></div>
  </div>
  <div class="row2">
    <div><label>Teléfono</label><input id="f-phone" placeholder="(432) 000-0000"></div>
    <div><label>Fecha</label><input id="f-date" type="date"></div>
  </div>
  <label>Ubicación</label><input id="f-loc" placeholder="I-20 Sweetwater TX">
  <label>Notas</label><textarea id="f-notes" placeholder="Detalles del servicio..."></textarea>
  <div class="seclbl">Llantas / Servicio</div>
  <div id="tw"></div>
  <button class="add-tire" onclick="addTire()">+ Agregar llanta</button>
  <div class="seclbl">Técnico</div>
  <div class="row2">
    <div><label>Técnico</label><input id="f-tech" placeholder="JHON / LUIS"></div>
    <div><label>Pago</label><select id="f-pay"><option>Wex</option><option>Check</option><option>Cash</option><option>Credit Card</option></select></div>
  </div>
  <div class="total-box">
    <label>TOTAL A COBRAR ($)</label>
    <input type="number" id="f-total" placeholder="0.00" step="0.01">
  </div>
  <button class="btn-red" onclick="saveNew()">Guardar Factura</button>
  <button onclick="clearF()" style="width:100%;padding:11px;background:#f0f0f0;color:#666;border:none;border-radius:10px;font-size:13px;cursor:pointer;margin-top:8px;margin-bottom:20px">Limpiar</button>
</div>
</div>

<div class="overlay" id="ov" onclick="closeSheet(event)">
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <div class="sh"><div class="sc" id="sc"></div><div class="ss" id="ss"></div></div>
  <div class="sb" id="sb"></div>
  <div class="stot"><span style="font-size:12px;color:#aaa">TOTAL</span><span style="font-size:24px;font-weight:900" id="st"></span></div>
  <div class="sbtns">
    <button class="pb" onclick="markStatus('PAID')">&#10003; Pagado</button>
    <button class="pe" onclick="markStatus('PENDING')">Pendiente</button>
    <button class="pc" onclick="closeSheetDirect()">Cerrar</button>
  </div>
</div>
</div>

var _cur = null, _tc = 0;
var POS = ['LFO','LFI','RFO','RFI','LRO','LRI','RRO','RRI','LMI','LMO','RMI','RMO','SPARE'];

function getAll() {
  var base = HIST.map(function(i){ return JSON.parse(JSON.stringify(i)); });
  try {
    var edits   = JSON.parse(localStorage.getItem('p_edits')   || '{}');
    var deleted = new Set(JSON.parse(localStorage.getItem('p_deleted') || '[]'));
    var newInvs = JSON.parse(localStorage.getItem('p_new')     || '[]');
    base = base.filter(function(i){ return !deleted.has(k(i)); });
    base = base.map(function(i){
      var ed = edits[k(i)];
      return ed ? Object.assign({}, i, ed) : i;
    });
    newInvs = newInvs.filter(function(i){ return !deleted.has(k(i)); });
    return base.concat(newInvs).sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  } catch(e) { return base; }
}

function k(i){ return String(i.number||'')+'|'+String(i.wo||''); }

function fmt(n){ return parseFloat(n||0).toFixed(2); }

function goTo(p) {
  ['summary','history','new'].forEach(function(id){
    document.getElementById('pg-'+id).classList.remove('active');
    document.getElementById('nb-'+id).classList.remove('active');
  });
  document.getElementById('pg-'+p).classList.add('active');
  document.getElementById('nb-'+p).classList.add('active');
  if (p==='summary') renderS();
  if (p==='history') renderH();
}

function renderS() {
  var all = getAll();
  var pend = all.filter(function(i){ return i.status==='PENDING'; });
  var paid = all.filter(function(i){ return i.status==='PAID'; });
  var pA = pend.reduce(function(s,i){ return s+(parseFloat(i.total)||0); },0);
  var dA = paid.reduce(function(s,i){ return s+(parseFloat(i.total)||0); },0);
  var np = all.filter(function(i){ return !(parseFloat(i.total)||0); }).length;
  var el = document.getElementById('pg-summary');
  el.innerHTML = '';
  var d = document.createElement('div');
  d.style.padding = '14px';
  d.innerHTML = [
    '<div class="card dark"><div class="amt">$'+fmt(pA)+'</div><div class="lbl">Pendiente de cobro</div></div>',
    '<div class="grid2">',
      '<div class="card"><div class="amt">$'+fmt(dA)+'</div><div class="lbl">Pagado</div></div>',
      '<div class="card"><div class="amt">$'+fmt(pA+dA)+'</div><div class="lbl">Total generado</div></div>',
    '</div>',
    '<div class="grid2">',
      '<div class="card"><div class="amt">'+pend.length+'</div><div class="lbl">Pendientes</div></div>',
      '<div class="card"><div class="amt">'+all.length+'</div><div class="lbl">Total facturas</div></div>',
    '</div>',
    np ? '<div class="card" style="background:#fff3cd"><div class="amt" style="color:#856404">'+np+'</div><div class="lbl" style="color:#856404">Sin precio</div></div>' : '',
    '<button class="btn-red" onclick="goTo('history')">Ver historial completo</button>'
  ].join('');
  el.appendChild(d);
}

function renderH() {
  var q = (document.getElementById('q').value||'').toLowerCase();
  var all = getAll();
  if (q) all = all.filter(function(i){
    var co = ((i.client&&i.client.company)||'').toLowerCase();
    return co.indexOf(q)>=0 || String(i.number||'').indexOf(q)>=0 || String(i.wo||'').indexOf(q)>=0;
  });
  var el = document.getElementById('hlist');
  if (!all.length) { el.innerHTML = '<div style="padding:40px;text-align:center;color:#bbb">Sin resultados</div>'; return; }
  el.innerHTML = '';
  all.forEach(function(inv){
    var co = (inv.client&&inv.client.company)||'—';
    var t  = parseFloat(inv.total)||0;
    var pd = inv.status==='PAID';
    var div = document.createElement('div');
    div.className = 'inv-item';
    div.innerHTML =
      '<div class="dot'+(pd?' paid':'')+'"></div>'+
      '<div class="info">'+
        '<div class="co">'+co+'</div>'+
        '<div class="sub">'+(inv.wo||inv.number||'—')+' &nbsp;·&nbsp; '+(inv.date||'')+'</div>'+
        '<span class="badge '+(pd?'bpd':'bp')+'">'+(pd?'PAID':'PENDING')+'</span>'+
      '</div>'+
      '<div class="amt-col'+(t?'':' zero')+'">$'+fmt(t)+'</div>';
    div.onclick = function(){ openSheet(inv); };
    el.appendChild(div);
  });
}

function openSheet(inv) {
  _cur = inv;
  var c = inv.client||{};
  document.getElementById('sc').textContent = c.company||'—';
  document.getElementById('ss').textContent = (inv.wo||inv.number||'—') + '  ·  ' + (inv.date||'');
  document.getElementById('st').textContent = '$'+fmt(parseFloat(inv.total)||0);
  var rows = '';
  if (c.unit)    rows += sr('Unidad', c.unit);
  if (c.driver)  rows += sr('Driver', c.driver);
  if (c.phone)   rows += sr('Teléfono', c.phone);
  if (c.roadside||c.address) rows += sr('Ubicación', c.roadside||c.address);
  if (c.po)      rows += sr('PO #', c.po);
  if (inv.number) rows += sr('Dispatch WO#', inv.number);
  var tech = inv.tech||{};
  if (tech.name) rows += sr('Técnico', tech.name);
  if (inv.payment) rows += sr('Pago', inv.payment);
  if (inv.notes) rows += sr('Notas', inv.notes);
  var tires = inv.tirePositions||[];
  if (tires.length) {
    rows += '<div style="font-size:10px;font-weight:700;color:#bbb;text-transform:uppercase;margin:12px 0 6px">Llantas</div>';
    tires.forEach(function(t){
      rows += '<div class="sr"><span class="sk"><span class="pbadge">'+(t.position||'—')+'</span> '+(t.size||'')+'</span><span class="sv">'+(parseFloat(t.price)?'$'+fmt(t.price):'—')+'</span></div>';
    });
  }
  document.getElementById('sb').innerHTML = rows;
  document.getElementById('ov').classList.add('open');
}

function sr(k,v){ return '<div class="sr"><span class="sk">'+k+'</span><span class="sv">'+v+'</span></div>'; }

function closeSheet(e){ if(e.target===document.getElementById('ov')) closeSheetDirect(); }
function closeSheetDirect(){ document.getElementById('ov').classList.remove('open'); _cur=null; }

function markStatus(s) {
  if (!_cur) return;
  _cur.status = s;
  var edits = JSON.parse(localStorage.getItem('p_edits')||'{}');
  edits[k(_cur)] = _cur;
  localStorage.setItem('p_edits', JSON.stringify(edits));
  closeSheetDirect();
  renderH(); renderS();
  toast2(s==='PAID' ? 'Marcado como PAID' : 'Marcado como PENDING');
}

function addTire(pos, size, price) {
  _tc++;
  var id = 'tc'+_tc;
  var opts = POS.map(function(p){ return '<option'+(p===(pos||'')?'selected':'')+'>'+p+'</option>'; }).join('');
  var d = document.createElement('div');
  d.className = 'tire-box';
  d.id = id;
  d.innerHTML =
    '<button class="xbtn" onclick="document.getElementById(''+id+'').remove()">&#215;</button>'+
    '<div class="row2" style="margin-top:4px">'+
      '<div><label>Posición</label><select style="margin-bottom:0"><option value="">—</option>'+opts+'</select></div>'+
      '<div><label>Medida</label><input value="'+(size||'')+'" placeholder="11R22.5" style="margin-bottom:0"></div>'+
    '</div>'+
    '<div style="margin-top:8px"><label>Precio $</label><input type="number" value="'+(price||'')+'" placeholder="0" step="0.01" style="margin-bottom:0"></div>';
  document.getElementById('tw').appendChild(d);
}

function getTires() {
  return Array.from(document.querySelectorAll('#tw .tire-box')).map(function(b){
    return { position: b.querySelector('select').value, size: b.querySelectorAll('input')[0].value.trim(), price: parseFloat(b.querySelectorAll('input')[1].value)||0 };
  }).filter(function(t){ return t.position||t.size; });
}

function saveNew() {
  var wo = document.getElementById('f-wo').value.trim();
  var date = document.getElementById('f-date').value;
  if (!wo||!date) { toast2('WO# y fecha son requeridos', true); return; }
  var inv = {
    number: wo, wo: '', date: date, status: 'PENDING',
    payment: document.getElementById('f-pay').value,
    total: parseFloat(document.getElementById('f-total').value)||0,
    totalLabor: parseFloat(document.getElementById('f-total').value)||0,
    notes: document.getElementById('f-notes').value.trim(),
    client: {
      company: document.getElementById('f-client').value.trim().toUpperCase(),
      unit:    document.getElementById('f-unit').value.trim().toUpperCase(),
      driver:  document.getElementById('f-driver').value.trim().toUpperCase(),
      phone:   document.getElementById('f-phone').value.trim(),
      roadside:document.getElementById('f-loc').value.trim(),
      po: document.getElementById('f-po').value.trim(),
      address:'', attn:'', email:''
    },
    tech: { name: document.getElementById('f-tech').value.trim().toUpperCase() },
    tirePositions: getTires(), expenses: [], sentState: {}
  };
  var n = JSON.parse(localStorage.getItem('p_new')||'[]');
  n.push(inv);
  localStorage.setItem('p_new', JSON.stringify(n));
  toast2('Factura guardada');
  clearF();
  goTo('history');
}

function clearF() {
  ['f-po','f-wo','f-client','f-unit','f-driver','f-phone','f-loc','f-notes','f-tech','f-total'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('f-date').valueAsDate = new Date();
  document.getElementById('tw').innerHTML = '';
  addTire();
}

function toast2(msg, err) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show'+(err?' err':'');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.className='toast'; }, 2500);
}

document.getElementById('f-date').valueAsDate = new Date();
addTire();
renderS();
</script>
