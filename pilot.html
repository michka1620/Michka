<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supreme AutoPro — Sistema</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f2f5;min-height:100vh}
.app{max-width:520px;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column}

/* NAV */
.nav{background:#1a1a2e;display:flex;overflow-x:auto}
.nav-btn{flex:1;min-width:60px;padding:12px 6px;color:#888;font-size:11px;font-weight:700;text-align:center;cursor:pointer;border:none;background:none;text-transform:uppercase;letter-spacing:.5px;border-bottom:3px solid transparent;white-space:nowrap}
.nav-btn.active{color:#e63946;border-bottom-color:#e63946}

/* HEADER */
.top-bar{background:#1a1a2e;color:white;padding:14px 16px 0}
.top-bar h1{font-size:17px;font-weight:900;letter-spacing:1px}
.top-bar p{font-size:10px;color:#666;margin-bottom:0}

/* PAGES */
.page{display:none;flex:1;padding:0}
.page.active{display:block}

/* SUMMARY CARDS */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.card{background:#f8f9fa;border-radius:12px;padding:14px;text-align:center}
.card.red{background:#1a1a2e;color:white}
.card .amt{font-size:22px;font-weight:900}
.card .lbl{font-size:10px;color:#999;text-transform:uppercase;margin-top:4px}
.card.red .lbl{color:#aaa}
.card-full{grid-column:1/-1}

/* HISTORY LIST */
.search-bar{padding:10px 14px;border-bottom:1px solid #f0f0f0}
.search-bar input{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;outline:none}
.inv-list{overflow-y:auto}
.inv-item{padding:12px 14px;border-bottom:1px solid #f5f5f5;cursor:pointer;display:flex;align-items:center;gap:10px}
.inv-item:hover{background:#fafafa}
.inv-item .dot{width:8px;height:8px;border-radius:50%;background:#ffc107;flex-shrink:0}
.inv-item .dot.paid{background:#28a745}
.inv-item .info{flex:1;min-width:0}
.inv-item .company{font-size:13px;font-weight:700;color:#1a1a2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-item .sub{font-size:11px;color:#999;margin-top:2px}
.inv-item .amount{font-size:14px;font-weight:700;color:#1a1a2e;text-align:right;white-space:nowrap}
.inv-item .amount.zero{color:#ccc}
.inv-item .badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;margin-top:3px;display:inline-block}
.badge-pending{background:#fff3cd;color:#856404}
.badge-paid{background:#d4edda;color:#155724}

/* DETAIL MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal{background:white;width:100%;max-width:520px;margin:0 auto;border-radius:16px 16px 0 0;max-height:90vh;overflow-y:auto;padding:0 0 24px}
.modal-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:12px auto}
.modal-header{padding:0 16px 12px;border-bottom:1px solid #f0f0f0}
.modal-company{font-size:16px;font-weight:900;color:#1a1a2e}
.modal-sub{font-size:12px;color:#999;margin-top:2px}
.modal-body{padding:14px 16px}
.mrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f8f8f8}
.mrow:last-child{border-bottom:none}
.mrow .mk{font-size:12px;color:#999}
.mrow .mv{font-size:12px;font-weight:600;color:#222;text-align:right;max-width:60%}
.msect{font-size:10px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:1px;margin:14px 0 6px}
.modal-total{background:#1a1a2e;color:white;border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin:14px 16px 0}
.modal-total .tl{font-size:12px;color:#aaa}
.modal-total .ta{font-size:24px;font-weight:900}
.modal-btns{display:flex;gap:8px;padding:12px 16px 0}
.modal-btns button{flex:1;padding:11px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer}
.btn-pay{background:#28a745;color:white}
.btn-pend{background:#ffc107;color:#333}
.btn-close{background:#f0f0f0;color:#333}
.pos-badge{display:inline-block;background:#e63946;color:white;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}

/* NEW INVOICE FORM */
.form-wrap{padding:14px;overflow-y:auto}
.sec-title{font-size:10px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px}
.field{margin-bottom:11px}
.field label{display:block;font-size:11px;color:#777;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px;color:#222;background:#fafafa;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#e63946;background:#fff}
.field textarea{resize:vertical;min-height:56px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tire-card{background:#f8f9fa;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid #eee;position:relative}
.tire-card .del{position:absolute;top:10px;right:10px;background:none;border:none;color:#ccc;font-size:18px;cursor:pointer;line-height:1}
.add-tire-btn{width:100%;padding:10px;border:2px dashed #ddd;border-radius:8px;background:none;color:#bbb;font-size:13px;cursor:pointer;margin-bottom:12px}
.add-tire-btn:hover{border-color:#e63946;color:#e63946}
.total-field{background:#1a1a2e;border-radius:12px;padding:16px;margin:16px 0}
.total-field label{font-size:11px;color:#aaa;display:block;margin-bottom:6px;text-transform:uppercase}
.total-field input{background:transparent;border:none;border-bottom:2px solid #333;color:white;font-size:28px;font-weight:900;width:100%;outline:none;padding:4px 0}
.save-btn{width:100%;padding:14px;background:#e63946;color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px}
.save-btn:hover{background:#c1121f}
.clear-btn{width:100%;padding:11px;background:#f0f0f0;color:#666;border:none;border-radius:10px;font-size:13px;cursor:pointer;margin-bottom:20px}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:white;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:all .3s;z-index:999;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#c1121f}

/* SYNC BAR */
.sync-bar{padding:8px 14px;background:#f8f9fa;border-bottom:1px solid #eee;display:flex;gap:8px}
.sync-bar button{flex:1;padding:7px;border-radius:7px;border:1px solid #ddd;background:white;font-size:11px;font-weight:700;cursor:pointer;color:#555}
.sync-bar button:hover{border-color:#e63946;color:#e63946}
</style>
</head>
<body>
<div class="app">

<div class="top-bar">
  <h1>SUPREME AUTOPRO LLC</h1>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="goTo('summary')">Resumen</button>
  <button class="nav-btn" onclick="goTo('history')">Historial</button>
  <button class="nav-btn" onclick="goTo('new')">+ Nueva</button>
</div>

<!-- SUMMARY PAGE -->
<div class="page active" id="page-summary">
  <div class="cards" id="summary-cards"></div>
</div>

<!-- HISTORY PAGE -->
<div class="page" id="page-history">
  <div class="sync-bar">
    <button onclick="pullFromKV()">&#128260; Recargar</button>
    <button onclick="pushToKV()">&#128190; Guardado local</button>
  </div>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Buscar cliente, WO#, dispatch..." oninput="renderHistory()">
  </div>
  <div class="inv-list" id="inv-list"></div>
</div>

<!-- NEW INVOICE PAGE -->
<div class="page" id="page-new">
  <div class="form-wrap" id="form-wrap">
    <div class="sec-title">Datos del Dispatch</div>
    <div class="row2">
      <div class="field"><label>PO # (Dispatch)</label><input id="f-po" type="text" placeholder="766908289"></div>
      <div class="field"><label>WO # Dispatch</label><input id="f-wo" type="text" placeholder="4920132XXX"></div>
    </div>
    <div class="field"><label>Cliente / Empresa</label><input id="f-client" type="text" placeholder="SMYRNA READY MIX..."></div>
    <div class="row2">
      <div class="field"><label>Unidad</label><input id="f-unit" type="text" placeholder="TRACTOR #12345"></div>
      <div class="field"><label>Driver</label><input id="f-driver" type="text" placeholder="Nombre"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Teléfono</label><input id="f-phone" type="text" placeholder="(432) 000-0000"></div>
      <div class="field"><label>Fecha</label><input id="f-date" type="date"></div>
    </div>
    <div class="field"><label>Ubicación</label><input id="f-loc" type="text" placeholder="I-20 Sweetwater TX"></div>
    <div class="field"><label>Notas</label><textarea id="f-notes" placeholder="Detalles del servicio..."></textarea></div>

    <div class="sec-title">Llantas / Servicio</div>
    <div id="tires-wrap"></div>
    <button class="add-tire-btn" onclick="addTire()">+ Agregar llanta</button>

    <div class="sec-title">Técnico & Pago</div>
    <div class="row2">
      <div class="field"><label>Técnico</label><input id="f-tech" type="text" placeholder="JHON / LUIS"></div>
      <div class="field"><label>Forma de pago</label>
        <select id="f-payment"><option>Wex</option><option>Check</option><option>Cash</option><option>Credit Card</option></select>
      </div>
    </div>

    <div class="total-field">
      <label>Total a cobrar ($)</label>
      <input type="number" id="f-total" placeholder="0.00" step="0.01">
    </div>

    <button class="save-btn" onclick="saveNew()">Guardar Factura</button>
    <button class="clear-btn" onclick="clearForm()">Limpiar</button>
  </div>
</div>

</div><!-- .app -->

<!-- MODAL DETAIL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
<div class="modal" id="modal">
  <div class="modal-handle"></div>
  <div class="modal-header">
    <div class="modal-company" id="m-company"></div>
    <div class="modal-sub" id="m-sub"></div>
  </div>
  <div class="modal-body" id="m-body"></div>
  <div class="modal-total"><span class="tl">TOTAL</span><span class="ta" id="m-total"></span></div>
  <div class="modal-btns">
    <button class="btn-pay" onclick="markPaid()">&#10003; Pagado</button>
    <button class="btn-pend" onclick="markPending()">Pendiente</button>
    <button class="btn-close" onclick="closeModalDirect()">Cerrar</button>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const KV_URL =  + kv_url + ;
const HIST = [];

var _current = null;
var _tireCount = 0;

// ---- STORAGE ----
function getAll() {
  var base = HIST.map(function(i){ return JSON.parse(JSON.stringify(i)); });
  try {
    var edits   = JSON.parse(localStorage.getItem('p_edits')   || '{}');
    var deleted = JSON.parse(localStorage.getItem('p_deleted') || '[]');
    var newInvs = JSON.parse(localStorage.getItem('p_new')     || '[]');
    var delSet  = new Set(deleted);
    base = base.filter(function(i){ return !delSet.has(key(i)); });
    base = base.map(function(i){
      var k = key(i);
      if (!edits[k]) return i;
      return Object.assign({}, i, edits[k]);
    });
    newInvs = newInvs.filter(function(i){ return !delSet.has(key(i)); });
    return base.concat(newInvs).sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  } catch(e) { return base; }
}

function key(i){ return String(i.number||'')+'|'+String(i.wo||''); }

function saveEdit(inv) {
  var edits = JSON.parse(localStorage.getItem('p_edits') || '{}');
  var k = key(inv);
  var isHist = HIST.some(function(h){ return key(h) === k; });
  if (isHist) {
    edits[k] = inv;
    localStorage.setItem('p_edits', JSON.stringify(edits));
  } else {
    var newInvs = JSON.parse(localStorage.getItem('p_new') || '[]');
    var idx = newInvs.findIndex(function(i){ return key(i) === k; });
    if (idx >= 0) newInvs[idx] = inv; else newInvs.push(inv);
    localStorage.setItem('p_new', JSON.stringify(newInvs));
  }
}

function deleteInv(inv) {
  var k = key(inv);
  var deleted = JSON.parse(localStorage.getItem('p_deleted') || '[]');
  if (deleted.indexOf(k) < 0) deleted.push(k);
  localStorage.setItem('p_deleted', JSON.stringify(deleted));
  // also remove from new
  var newInvs = JSON.parse(localStorage.getItem('p_new') || '[]');
  localStorage.setItem('p_new', JSON.stringify(newInvs.filter(function(i){ return key(i)!==k; })));
}

// ---- KV SYNC ----
function pullFromKV() { renderHistory(); renderSummary(); showToast('Datos cargados'); }
function pushToKV() { showToast('Guardado localmente'); }

// ---- NAV ----
function goTo(page) {
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('page-'+page).classList.add('active');
  var idx = {summary:0, history:1, new:2}[page];
  document.querySelectorAll('.nav-btn')[idx].classList.add('active');
  if (page==='summary') renderSummary();
  if (page==='history') renderHistory();
}

// ---- SUMMARY ----
function renderSummary() {
  var all = getAll();
  var pending = all.filter(function(i){ return i.status==='PENDING'; });
  var paid    = all.filter(function(i){ return i.status==='PAID'; });
  var pendAmt = pending.reduce(function(s,i){ return s+(parseFloat(i.total)||0); }, 0);
  var paidAmt = paid.reduce(function(s,i){    return s+(parseFloat(i.total)||0); }, 0);
  var totalAmt = pendAmt + paidAmt;
  var noPrice = all.filter(function(i){ return !parseFloat(i.total); }).length;

  document.getElementById('summary-cards').innerHTML =
    '<div class="card red card-full">' +
      '<div class="amt">$'+fmt(pendAmt)+'</div>' +
      '<div class="lbl">Pendiente de cobro</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="amt">$'+fmt(paidAmt)+'</div>' +
      '<div class="lbl">Pagado</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="amt">$'+fmt(totalAmt)+'</div>' +
      '<div class="lbl">Total generado</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="amt">'+pending.length+'</div>' +
      '<div class="lbl">Facturas pendientes</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="amt">'+all.length+'</div>' +
      '<div class="lbl">Total facturas</div>' +
    '</div>' +
    (noPrice ? '<div class="card card-full" style="background:#fff3cd"><div class="amt" style="color:#856404">'+noPrice+'</div><div class="lbl" style="color:#856404">Sin precio asignado</div></div>' : '') +
    '<div style="padding:4px 0 8px;grid-column:1/-1"><button onclick="goTo('history')" style="width:100%;padding:12px;border-radius:10px;border:none;background:#e63946;color:white;font-size:14px;font-weight:700;cursor:pointer">Ver historial completo</button></div>';
}

// ---- HISTORY ----
function renderHistory() {
  var q = (document.getElementById('search-input').value || '').toLowerCase();
  var all = getAll();
  if (q) all = all.filter(function(i){
    var c = (i.client && i.client.company) ? i.client.company.toLowerCase() : '';
    return c.indexOf(q)>=0 || String(i.number||'').indexOf(q)>=0 || String(i.wo||'').indexOf(q)>=0;
  });
  var html = '';
  all.forEach(function(inv) {
    var company = (inv.client && inv.client.company) ? inv.client.company : '—';
    var total = parseFloat(inv.total) || 0;
    var paid = inv.status === 'PAID';
    html += '<div class="inv-item" onclick='openModal('+JSON.stringify(JSON.stringify(inv))+')'>'+
      '<div class="dot'+(paid?' paid':'')+'"></div>'+
      '<div class="info">'+
        '<div class="company">'+company+'</div>'+
        '<div class="sub">'+(inv.wo||'—')+' &nbsp;·&nbsp; '+(inv.date||'')+'</div>'+
        '<span class="badge '+(paid?'badge-paid':'badge-pending')+'">'+(paid?'PAID':'PENDING')+'</span>'+
      '</div>'+
      '<div class="amount'+(total?'':' zero')+'">$'+fmt(total)+'</div>'+
    '</div>';
  });
  if (!html) html = '<div style="padding:40px;text-align:center;color:#bbb;font-size:13px">Sin resultados</div>';
  document.getElementById('inv-list').innerHTML = html;
}

// ---- MODAL ----
function openModal(invStr) {
  var inv = JSON.parse(invStr);
  _current = inv;
  var c = inv.client || {};
  document.getElementById('m-company').textContent = c.company || '—';
  document.getElementById('m-sub').textContent = (inv.wo||'—') + '  ·  ' + (inv.date||'');
  document.getElementById('m-total').textContent = '$'+fmt(parseFloat(inv.total)||0);

  var tech = inv.tech || {};
  var html = '';
  if (c.unit)    html += row('Unidad', c.unit);
  if (c.driver)  html += row('Driver', c.driver);
  if (c.phone)   html += row('Teléfono', c.phone);
  if (c.roadside||c.address) html += row('Ubicación', c.roadside||c.address);
  if (c.po)      html += row('PO #', c.po);
  if (inv.number) html += row('Dispatch WO#', inv.number);
  if (tech.name) html += row('Técnico', tech.name);
  if (inv.payment) html += row('Pago', inv.payment);
  if (inv.notes) html += row('Notas', inv.notes);

  var tires = inv.tirePositions || [];
  if (tires.length) {
    html += '<div class="msect">Llantas</div>';
    tires.forEach(function(t){
      html += '<div class="mrow"><span class="mk"><span class="pos-badge">'+(t.position||'—')+'</span> '+t.size+'</span>'+
              '<span class="mv">'+(parseFloat(t.price)?'$'+fmt(t.price):'—')+'</span></div>';
    });
  }

  document.getElementById('m-body').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}

function row(k, v) { return '<div class="mrow"><span class="mk">'+k+'</span><span class="mv">'+v+'</span></div>'; }

function closeModal(e) { if (e.target===document.getElementById('modal-overlay')) closeModalDirect(); }
function closeModalDirect() { document.getElementById('modal-overlay').classList.remove('open'); _current=null; }

function markPaid()    { if(_current){ _current.status='PAID';    saveEdit(_current); closeModalDirect(); renderHistory(); renderSummary(); showToast('Marcado como PAID'); } }
function markPending() { if(_current){ _current.status='PENDING'; saveEdit(_current); closeModalDirect(); renderHistory(); renderSummary(); showToast('Marcado como PENDING'); } }

// ---- NEW INVOICE ----
var POSITIONS = ['LFO','LFI','RFO','RFI','LRO','LRI','RRO','RRI','SPARE'];

function addTire(pos, size, price) {
  _tireCount++;
  var id = 'tc_'+_tireCount;
  var opts = POSITIONS.map(function(p){ return '<option'+(p===(pos||'')?'selected':'')+'>'+p+'</option>'; }).join('');
  var html = '<div class="tire-card" id="'+id+'">'+
    '<button class="del" onclick="document.getElementById(''+id+'').remove()">×</button>'+
    '<div class="row3" style="margin-top:4px">'+
      '<div class="field"><label>Posición</label><select><option value="">—</option>'+opts+'</select></div>'+
      '<div class="field"><label>Medida</label><input type="text" value="'+(size||'')+'" placeholder="11R22.5"></div>'+
      '<div class="field"><label>Precio $</label><input type="number" value="'+(price||'')+'" placeholder="0" step="0.01"></div>'+
    '</div>'+
  '</div>';
  document.getElementById('tires-wrap').insertAdjacentHTML('beforeend', html);
}

function getTires() {
  return Array.from(document.querySelectorAll('#tires-wrap .tire-card')).map(function(card){
    return {
      position: card.querySelector('select').value,
      size:     card.querySelectorAll('input')[0].value.trim(),
      price:    parseFloat(card.querySelectorAll('input')[1].value)||0
    };
  }).filter(function(t){ return t.position||t.size; });
}

function saveNew() {
  var wo   = document.getElementById('f-wo').value.trim();
  var po   = document.getElementById('f-po').value.trim();
  var date = document.getElementById('f-date').value;
  var total = parseFloat(document.getElementById('f-total').value)||0;
  if (!wo || !date) { showToast('WO# y fecha son requeridos', true); return; }

  var inv = {
    number: wo,
    wo: '',
    date: date,
    status: 'PENDING',
    payment: document.getElementById('f-payment').value,
    total: total,
    totalLabor: total,
    notes: document.getElementById('f-notes').value.trim(),
    client: {
      company: document.getElementById('f-client').value.trim().toUpperCase(),
      unit:    document.getElementById('f-unit').value.trim().toUpperCase(),
      driver:  document.getElementById('f-driver').value.trim().toUpperCase(),
      phone:   document.getElementById('f-phone').value.trim(),
      roadside:document.getElementById('f-loc').value.trim(),
      po:      po, address:'', attn:'', email:''
    },
    tech: { name: document.getElementById('f-tech').value.trim().toUpperCase() },
    vehicle: {},
    tirePositions: getTires(),
    expenses: [], sentState: {}
  };

  var newInvs = JSON.parse(localStorage.getItem('p_new') || '[]');
  newInvs.push(inv);
  localStorage.setItem('p_new', JSON.stringify(newInvs));
  pushToKV();
  showToast('Factura guardada');
  clearForm();
  goTo('history');
}

function clearForm() {
  ['f-po','f-wo','f-client','f-unit','f-driver','f-phone','f-loc','f-notes','f-tech','f-total'].forEach(function(id){
    document.getElementById(id).value='';
  });
  document.getElementById('f-date').valueAsDate = new Date();
  document.getElementById('tires-wrap').innerHTML = '';
  addTire();
}

// ---- TOAST ----
function showToast(msg, err) {
  var t = document.getElementById('toast');
  t.innerHTML = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.className='toast'; }, 2800);
}

function fmt(n) { return parseFloat(n||0).toFixed(2); }
