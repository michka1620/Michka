<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilot Test</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f2f5}
.app{max-width:520px;margin:0 auto;background:#fff;min-height:100vh}
.topbar{background:#1a1a2e;color:white;padding:14px 16px}
.topbar h1{font-size:17px;font-weight:900}
.nav{background:#1a1a2e;display:flex;border-top:1px solid #333}
.nav button{flex:1;padding:12px;color:#888;font-size:11px;font-weight:700;cursor:pointer;border:none;background:none;text-transform:uppercase;border-bottom:3px solid transparent}
.nav button.active{color:#e63946;border-bottom-color:#e63946}
.page{display:none;padding:16px}
.page.active{display:block}
.card{background:#f8f9fa;border-radius:12px;padding:16px;margin-bottom:10px;text-align:center}
.card.dark{background:#1a1a2e;color:white}
.card .amt{font-size:26px;font-weight:900}
.card .lbl{font-size:11px;color:#999;text-transform:uppercase;margin-top:4px}
.card.dark .lbl{color:#aaa}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.btn-red{width:100%;padding:13px;background:#e63946;color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}
.inv-item{padding:12px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.inv-item:hover{background:#fafafa}
.co{font-size:13px;font-weight:700;color:#1a1a2e}
.sub{font-size:11px;color:#999;margin-top:2px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#fafafa;outline:none;margin-bottom:10px;color:#222}
label{display:block;font-size:11px;color:#777;margin-bottom:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seclbl{font-size:10px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:1px;margin:14px 0 8px}
</style>
</head>
<body>
<div class="app">
<div class="topbar"><h1>SUPREME AUTOPRO LLC</h1></div>
<div class="nav">
  <button id="n0" class="active" onclick="go(0)">Resumen</button>
  <button id="n1" onclick="go(1)">Historial</button>
  <button id="n2" onclick="go(2)">+ Nueva</button>
</div>
<div id="p0" class="page active" id="p0"></div>
<div id="p1" class="page" style="padding:0">
  <div style="padding:10px 14px;border-bottom:1px solid #f0f0f0">
    <input id="q" placeholder="Buscar..." oninput="renderH()">
  </div>
  <div id="hlist"></div>
</div>
<div id="p2" class="page">
  <div class="seclbl">Datos del Dispatch</div>
  <div class="row2">
    <div><label>PO #</label><input id="fpo" placeholder="766908289"></div>
    <div><label>WO # Dispatch</label><input id="fwo" placeholder="4920132XXX"></div>
  </div>
  <label>Cliente</label><input id="fcl" placeholder="EMPRESA LLC">
  <div class="row2">
    <div><label>Unidad</label><input id="fun" placeholder="TRACTOR #12345"></div>
    <div><label>Driver</label><input id="fdr" placeholder="Nombre"></div>
  </div>
  <div class="row2">
    <div><label>Teléfono</label><input id="fph" placeholder="(432) 000-0000"></div>
    <div><label>Fecha</label><input id="fdt" type="date"></div>
  </div>
  <label>Ubicación</label><input id="flc" placeholder="I-20 Sweetwater TX">
  <label>Notas</label><textarea id="fno" placeholder="Detalles..."></textarea>
  <div class="seclbl">Llanta</div>
  <div class="row2">
    <div><label>Posición</label>
      <select id="fpos">
        <option value="">—</option>
        <option>LFO</option><option>LFI</option><option>RFO</option><option>RFI</option>
        <option>LRO</option><option>LRI</option><option>RRO</option><option>RRI</option>
        <option>LMI</option><option>LMO</option><option>SPARE</option>
      </select>
    </div>
    <div><label>Medida</label><input id="fsz" placeholder="11R22.5"></div>
  </div>
  <div class="seclbl">Técnico y Total</div>
  <div class="row2">
    <div><label>Técnico</label><input id="fte" placeholder="JHON / LUIS"></div>
    <div><label>Pago</label><select id="fpay"><option>Wex</option><option>Check</option><option>Cash</option></select></div>
  </div>
  <label>Total $</label><input type="number" id="fto" placeholder="0.00" step="0.01">
  <button class="btn-red" onclick="saveNew()">Guardar</button>
</div>
</div>
<script>
function go(i) {
  for(var j=0;j<3;j++){
    document.getElementById('p'+j).classList.remove('active');
    document.getElementById('n'+j).classList.remove('active');
  }
  document.getElementById('p'+i).classList.add('active');
  document.getElementById('n'+i).classList.add('active');
  if(i===0) renderS();
  if(i===1) renderH();
}

function getAll() {
  try {
    var n = JSON.parse(localStorage.getItem('pilot_new')||'[]');
    return n.sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  } catch(e){ return []; }
}

function fmt(n){ return parseFloat(n||0).toFixed(2); }

function renderS() {
  var all = getAll();
  var pend = all.filter(function(i){return i.status==='PENDING';});
  var paid = all.filter(function(i){return i.status==='PAID';});
  var pA = pend.reduce(function(s,i){return s+(parseFloat(i.total)||0);},0);
  var dA = paid.reduce(function(s,i){return s+(parseFloat(i.total)||0);},0);
  var pg = document.getElementById('p0');
  pg.innerHTML =
    '<div style="padding:14px">'+
    '<div class="card dark"><div class="amt">$'+fmt(pA)+'</div><div class="lbl">Pendiente de cobro</div></div>'+
    '<div class="grid2">'+
      '<div class="card"><div class="amt">$'+fmt(dA)+'</div><div class="lbl">Pagado</div></div>'+
      '<div class="card"><div class="amt">'+all.length+'</div><div class="lbl">Total facturas</div></div>'+
    '</div>'+
    '<button class="btn-red" onclick="go(1)">Ver historial</button>'+
    '<button class="btn-red" style="background:#333;margin-top:8px" onclick="go(2)">+ Crear factura</button>'+
    '</div>';
}

function renderH() {
  var q = (document.getElementById('q').value||'').toLowerCase();
  var all = getAll();
  if(q) all = all.filter(function(i){ return ((i.client||'').toLowerCase().indexOf(q)>=0)||(String(i.wo||'').indexOf(q)>=0); });
  var el = document.getElementById('hlist');
  if(!all.length){el.innerHTML='<div style="padding:40px;text-align:center;color:#bbb">Sin facturas aun</div>';return;}
  el.innerHTML = all.map(function(i){
    return '<div class="inv-item"><div class="co">'+(i.client||'—')+'</div>'+
      '<div class="sub">'+(i.wo||'—')+' · '+(i.date||'')+'&nbsp;&nbsp;<b>$'+fmt(i.total)+'</b> — '+(i.status||'')+'</div></div>';
  }).join('');
}

function saveNew() {
  var wo = document.getElementById('fwo').value.trim();
  var dt = document.getElementById('fdt').value;
  if(!wo||!dt){alert('WO# y fecha son requeridos');return;}
  var inv = {
    wo: wo, date: dt, status: 'PENDING',
    client: document.getElementById('fcl').value.trim().toUpperCase(),
    unit: document.getElementById('fun').value.trim(),
    driver: document.getElementById('fdr').value.trim(),
    phone: document.getElementById('fph').value.trim(),
    po: document.getElementById('fpo').value.trim(),
    loc: document.getElementById('flc').value.trim(),
    notes: document.getElementById('fno').value.trim(),
    tech: document.getElementById('fte').value.trim().toUpperCase(),
    payment: document.getElementById('fpay').value,
    pos: document.getElementById('fpos').value,
    size: document.getElementById('fsz').value.trim(),
    total: parseFloat(document.getElementById('fto').value)||0
  };
  var all = JSON.parse(localStorage.getItem('pilot_new')||'[]');
  all.push(inv);
  localStorage.setItem('pilot_new', JSON.stringify(all));
  alert('Factura guardada!');
  go(1);
}

document.getElementById('fdt').valueAsDate = new Date();
renderS();
</script>
</body>
</html>
